<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Raketoplán</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="game" width="256" height="192"></canvas>

    <div class="touch" id="touch" aria-label="Dotykové ovládání">
        <div class="pad">
            <button data-k="left">◀</button>
            <button data-k="right">▶</button>
        </div>
        <div class="pad">
            <button data-k="up">▲<small>tryska</small></button>
            <button data-k="fire">●<small>střelba</small></button>
        </div>
    </div>

    <p class="help">
        Šipky / WASD = pohyb, ↑ / W = tryska · Mezerník / Enter = střelba (a start) · P = pauza · M = zvuk
    </p>

    <script src="js/font.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
